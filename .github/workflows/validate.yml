name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The CLI repo is private, so its release cannot be downloaded here. scripts/validate.mjs runs the same checks.
      - run: npm install --no-save yaml@2
      - run: node scripts/validate.mjs .
